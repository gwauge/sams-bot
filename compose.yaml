services:
  sams-bot:
    build: .
    # main.py exits 0 once every listed match is finished; only restart after crashes
    restart: on-failure
    environment:
      TZ: Europe/Berlin  # match start times are printed in local time
    env_file:
      - path: .env  # TWITCH_USERNAME + TWITCH_CLIENT_ID/_SECRET/_REFRESH_TOKEN (or TWITCH_TOKEN)
        required: false
    volumes:
      - type: bind
        source: ./matches.csv
        target: /config/matches.csv
        read_only: true
        bind:
          # fail instead of silently creating a directory named matches.csv
          create_host_path: false
